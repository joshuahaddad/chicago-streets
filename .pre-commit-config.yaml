# The checks .github/workflows/checks.yml runs, as git hooks. Each hook runs the same
# `uv run` command as the workflow, so the tool versions are uv.lock's, not a second pin
# here. The fast checks run on every commit; pytest runs on push. Install both hook types
# once per clone:
#
#   uv run pre-commit install
#
# and run everything by hand with `uv run pre-commit run --all-files --hook-stage pre-push`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Scans the staged changes for secrets. gitleaks is a Go program, not in uv.lock, so
  # this rev is a second pin (checks.yml pins the same version's image by digest);
  # pre-commit downloads Go to build it if the host has none.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi, markdown] # ruff format also formats the Python blocks in markdown
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
