# The checks .github/workflows/checks.yml runs, as git hooks, with the tool versions from
# uv.lock rather than a second pin here. The ruff hooks fix the staged files where the
# workflow only checks (docs/design/0001-project-setup.md). The fast checks run on every
# commit; pytest runs on push. Install both hook types once per clone:
#
#   uv run pre-commit install
#
# and run everything by hand with `uv run pre-commit run --all-files --hook-stage pre-push`.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # Scans the staged changes for secrets. gitleaks is a Go program, not in uv.lock, so
  # this rev is a second pin (checks.yml pins the same version's image by digest);
  # pre-commit downloads Go to build it if the host has none.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: uv-lock
        name: uv.lock matches pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      # The two fixers get the staged file names, so they never edit a file outside the commit.
      # A hook that changes a file fails the commit: read the diff, stage it, commit again.
      # --force-exclude keeps ruff's own excludes for files named on the command line.
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, markdown] # ruff format also formats the Python blocks in markdown
      # The whole repo, not the staged files: a signature change breaks callers that aren't staged.
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
