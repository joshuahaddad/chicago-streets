[project]
name = "chicago-streets"
version = "0.0.0"
description = "Getting around Chicago safely and reliably, built from public data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["chicago_streets"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# TID251 bans the APIs below, in src/ only: the Gates section of docs/Style.md.
select = [
    "E", # pycodestyle block
    "W", 
    "F", # unused imports, undefined names
    "I", # import sorting
    "UP", # pyupgarde   
    "B", # flake-8 block (bugs/mutable defaults, simplify, annotations, secrets, returns, pathlib, logging, imports)
    "SIM",
    "ANN",
    "S",
    "RET",
    "PTH",
    "G",
    "LOG",
    "T20",
    "TID251",   
    "C90", # complexity
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"collections.namedtuple".msg = "use a frozen dataclass constructed by keyword (Style: Gates)"
"typing.NamedTuple".msg = "use a frozen dataclass constructed by keyword (Style: Gates)"
"subprocess".msg = "run a program only through the module that owns its interface (Style: Gates)"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"!tests/**" = ["T20"]
"!src/**" = ["ANN", "TID251", "S101", "S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Standard mode plus strict mode's rules on annotations, overrides, unused and unneeded code and
# private use, as errors. Strict mode's reportUnknown{Variable,Member,Argument}Type are left out, so
# a library without type stubs doesn't make every call into it an error.
reportMissingParameterType = "error"
reportUnknownParameterType = "error"
reportUnknownLambdaType = "error"
reportMissingTypeArgument = "error"
reportPossiblyUnboundVariable = "error"
reportFunctionMemberAccess = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportOverlappingOverload = "error"
reportInconsistentConstructor = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
reportUnnecessaryComparison = "error"
reportUnnecessaryContains = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportUnusedFunction = "error"
reportUnusedClass = "error"
reportDuplicateImport = "error"
reportPrivateUsage = "error"
reportConstantRedefinition = "error"
reportDeprecated = "error"
reportMatchNotExhaustive = "error"
reportSelfClsParameterName = "error"
reportTypeCommentUsage = "error"
